
services:
  kali:
    build:
      context: ./kali
      dockerfile: Dockerfile
    container_name: cyberlab-kali
    hostname: kali-attacker
    command: sleep infinity
    restart: unless-stopped
    networks:
      attacker_net:
        ipv4_address: 172.30.10.10
      target_net:
        ipv4_address: 172.30.20.20
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_forward: "0"
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: cyberlab-juice-shop
    hostname: juice-shop
    restart: unless-stopped
    networks:
      target_net:
        ipv4_address: 172.30.20.10
    mem_limit: 1g
    cpus: 1.0
  metasploitable:
      image: tleemcjr/metasploitable2:latest
      container_name: cyberlab-metasploitable2
      hostname: metasploitable2
      restart: unless-stopped
      networks:
        target_net:
          ipv4_address: 172.30.20.30
      cap_drop:
        - ALL
      cap_add:
        - NET_BIND_SERVICE
        - SETUID
        - SETGID
      security_opt:
        - no-new-privileges:true
      sysctls:
        net.ipv4.ip_forward: "0"
      mem_limit: 1g
      cpus: 1.0
      command: ["sh", "-c", "/bin/services.sh & exec tail -f /dev/null"]

networks:
  attacker_net:
    name: cyberlab_attacker
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24

  target_net:
    name: cyberlab_targets
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24

  monitoring_net:
    name: cyberlab_monitoring
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.30.0/24
